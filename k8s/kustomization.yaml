apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vllm

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# ConfigMap и Secret генерируются из файлов. К имени добавляется хэш содержимого,
# поэтому изменение конфига или токенов автоматически перезапускает под с новыми значениями.
configMapGenerator:
  - name: vllm-config
    files:
      - config.yaml=config/vllm-config.yaml
  - name: vllm-model
    envs:
      - config/model.env

secretGenerator:
  - name: vllm-secrets
    envs:
      - secrets/secrets.env

# Теги образов меняются здесь, без правки манифестов.
images:
  - name: vllm-cpu
    newTag: "0.31.0"
  - name: vllm-model-downloader
    newTag: "0.1.0"
