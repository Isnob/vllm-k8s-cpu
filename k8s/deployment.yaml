apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: vllm
spec:
  replicas: 1
  # PVC с весами — ReadWriteOnce: старый под должен освободить volume до старта нового.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
    spec:
      automountServiceAccountToken: false
      # Иначе k8s добавит в контейнер переменные сервиса vllm (VLLM_PORT=tcp://...),
      # а vLLM читает VLLM_PORT как свою настройку и падает при старте.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      # Скачивание весов вынесено в отдельный лёгкий rootless-образ.
      # Если веса уже в PVC, контейнер завершается сразу, без обращения к сети.
      initContainers:
        - name: model-downloader
          image: vllm-model-downloader:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vllm-model
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: HF_TOKEN
                  optional: true
          volumeMounts:
            - name: models
              mountPath: /models
            - name: downloader-home
              mountPath: /home/downloader
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

      containers:
        - name: vllm
          image: vllm-cpu:0.31.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vllm-model
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: API_TOKEN
            - name: SERVE_CONFIG_FILE
              value: /etc/vllm/config.yaml
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: vllm-config
              mountPath: /etc/vllm
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/vllm/.cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # В лимит памяти контейнера входит и page cache от чтения весов (~3 ГБ),
          # поэтому лимит с запасом: веса bf16 ~3 ГБ + KV-кэш 1 ГиБ + рантайм torch.
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
            limits:
              cpu: "6"
              memory: 10Gi
          # Загрузка модели на CPU занимает минуты — startupProbe даёт до 15 минут на старт.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: vllm-config
          configMap:
            name: vllm-config
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: downloader-home
          emptyDir: {}
